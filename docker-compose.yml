# Local dev:   docker compose up postgres redis   (run Django + Vite on the host)
# Full stack:  docker compose up --build           (http://localhost:8080)
# With demo traffic: docker compose --profile demo up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metric_wave}
      POSTGRES_USER: ${POSTGRES_USER:-metric_wave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metric_wave}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-metric_wave}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  simulator:
    build: ./backend
    env_file: .env
    profiles: ["demo"]
    command: ["sh", "-c", "python manage.py seed_demo && python manage.py simulate_metrics --interval 1"]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
